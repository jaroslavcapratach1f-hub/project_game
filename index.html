<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no,
          viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <title>Blitzmire</title>
    <!--
      Preloaded with top fetch priority so the browser's HTML preload
      scanner starts fetching these the INSTANT the page is parsed, before
      main.js has even downloaded, let alone run — and, critically, before
      WorldScene's own base/neighbour-compound GLB loads (several MB each)
      have a chance to saturate the connection pool ahead of them. Real,
      measured bug: without this, the network log showed these two ~90KB
      images queued behind ~20 multi-MB model downloads, landing several
      seconds late. Served from public/ (not imported as a module asset)
      so this path is stable in both dev and the hashed production build —
      LoadingScreen.js references the same literal path.
    -->
    <link rel="preload" as="image" href="/loading/horizontal.jpg" fetchpriority="high">
    <link rel="preload" as="image" href="/loading/vertical.jpg" fetchpriority="high">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <script type="module" src="src/main.js"></script>
</body>
</html>
